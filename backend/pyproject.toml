[project]
name = "multi-rag"
version = "0.1.0"
description = "Multi-source RAG system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "python-dotenv>=1.0.1",
    "pypdf>=4.2.0",
    "uvicorn>=0.29.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
